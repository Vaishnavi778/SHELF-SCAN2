<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelf Scan - Settings</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <h2><span class="material-icons">handshake</span> Shelf Scan</h2>
        <ul>
            <li><a href="./index.html"><span class="material-icons">dashboard</span> Dashboard</a></li>
            <li><a href="./product-id.html"><span class="material-icons">list</span> Product ID</a></li>
            <li><a href="./reports.html"><span class="material-icons">assessment</span> Reports</a></li>
            <li><a href="./billing.html"><span class="material-icons">receipt</span> Billing</a></li>
            <li class="active"><a href="./settings.html"><span class="material-icons">settings</span> Settings</a></li>
            <li><a href="#" id="logout-btn"><span class="material-icons">logout</span> Logout</a></li>
        </ul>
        <div id="credit"><p>© Shelf Scan | 2025</p></div>
    </div>

    <div class="dashboard settings-page">
        <h2>Settings</h2>
        <form id="settings-form" aria-label="Settings Form">
            <div class="settings-section">
                <h3>Appearance</h3>
                <label for="theme">Theme:</label>
                <select id="theme" name="theme">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>
            <div class="settings-section">
                <h3>Notifications</h3>
                <label for="notifications">Enable Notifications:</label>
                <input type="checkbox" id="notifications" name="notifications">
            </div>
            <div class="settings-section">
                <h3>Account</h3>
                <label for="username">Username:</label>
                <input type="text" id="username" placeholder="Enter username">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" placeholder="Enter new password">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" placeholder="Confirm new password">
            </div>
            <button type="submit" aria-label="Save Settings"><i class="material-icons">save</i> Save</button>
            <button type="button" id="reset-settings" aria-label="Reset Settings"><i class="material-icons">restore</i> Reset</button>
        </form>
    </div>

    <script src="./settings.js"></script>
</body>
</html>
